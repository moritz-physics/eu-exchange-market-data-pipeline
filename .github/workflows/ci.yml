name: CI

# Runs the Python test suite (tests_python/) on every push / PR.
#
# This replaces the previous workflow that ran `npx playwright test`,
# which executed the first-generation TypeScript scrapers live against
# real venues on every push. Those prototypes are now archived under
# legacy/ and the maintained pipeline is the Python package in
# german_scraper/.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --extra iceberg

      - name: Run test suite
        run: uv run pytest tests_python/ -v
